<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Validador de Garantia HP</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            padding: 20px; 
            background: #f0f2f5;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container { 
            max-width: 750px; 
            width: 100%;
            margin: auto; 
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 { 
            color: #0096d6; 
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 25px;
            font-size: 16px;
        }
        .input-group { 
            margin-bottom: 20px; 
        }
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600;
            color: #333;
            font-size: 15px;
        }
        .input-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        input[type="text"] { 
            flex: 1;
            min-width: 200px;
            padding: 14px 18px; 
            border: 2px solid #e0e0e0; 
            border-radius: 10px; 
            font-size: 16px;
            transition: border-color 0.3s;
            background: #fafafa;
        }
        input[type="text"]:focus {
            border-color: #0096d6;
            outline: none;
            background: white;
            box-shadow: 0 0 0 3px rgba(0,150,214,0.1);
        }
        button { 
            padding: 14px 35px; 
            background: linear-gradient(135deg, #0096d6, #0077b3);
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 16px;
            font-weight: 600;
            cursor: pointer; 
            transition: all 0.3s;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0,150,214,0.3);
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,150,214,0.4);
        }
        button:disabled { 
            opacity: 0.6; 
            cursor: not-allowed; 
            transform: none;
        }
        #resultado { 
            margin-top: 25px; 
            padding: 25px; 
            border-radius: 12px; 
            background: #f8f9fa; 
            border: 2px solid #e9ecef;
            white-space: pre-wrap; 
            word-wrap: break-word; 
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.8;
            min-height: 120px;
            transition: all 0.3s;
        }
        .sucesso { 
            border-color: #28a745; 
            background: linear-gradient(135deg, #d4edda, #c3e6cb);
        }
        .erro { 
            border-color: #dc3545; 
            background: linear-gradient(135deg, #f8d7da, #f5c6cb);
        }
        .loading {
            border-color: #ffc107;
            background: linear-gradient(135deg, #fff3cd, #ffe69c);
        }
        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #999;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .test-list {
            margin: 15px 0 10px;
            padding: 12px 15px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 13px;
            border: 1px solid #eee;
        }
        .test-list .label {
            font-weight: 600;
            color: #555;
            margin-right: 10px;
        }
        .test-list span {
            display: inline-block;
            background: white;
            padding: 4px 14px;
            border-radius: 20px;
            margin: 3px 4px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #dee2e6;
            font-family: monospace;
            font-size: 13px;
        }
        .test-list span:hover {
            background: #0096d6;
            color: white;
            border-color: #0096d6;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-ativo { background: #28a745; color: white; }
        .status-expirado { background: #dc3545; color: white; }
        .status-pendente { background: #ffc107; color: #333; }
        @media (max-width: 600px) {
            .container { padding: 20px; }
            .input-row { flex-direction: column; }
            button { width: 100%; justify-content: center; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔍 Validador de Garantia HP</h1>
    <p class="subtitle">Insere o número de série para consultar o estado da garantia do produto.</p>
    
    <div class="input-group">
        <label for="serial">🔹 Número de Série:</label>
        <div class="input-row">
            <input type="text" id="serial" placeholder="Ex: 39PKA1" value="39PKA1">
            <button id="btnConsultar">🔍 Consultar</button>
        </div>
    </div>

    <div class="test-list">
        <span class="label">⚡ Testes rápidos:</span>
        <span onclick="document.getElementById('serial').value='39PKA1'; consultarGarantia();">39PKA1</span>
        <span onclick="document.getElementById('serial').value='CND1234ABC'; consultarGarantia();">CND1234ABC</span>
        <span onclick="document.getElementById('serial').value='5CD1234XYZ'; consultarGarantia();">5CD1234XYZ</span>
        <span onclick="document.getElementById('serial').value='SER123456'; consultarGarantia();">SER123456</span>
    </div>

    <div id="resultado">💡 Aguardando consulta...</div>
    <div class="footer">
        🔒 Utiliza um proxy CORS para comunicação segura com a API da HP<br>
        <span style="font-size: 11px; color: #bbb;">v1.0 - Consulta garantia de produtos HP</span>
    </div>
</div>

<script>
    // Lista de proxies CORS disponíveis (tenta cada um até funcionar)
    const PROXIES = [
        'https://api.allorigins.win/raw?url=',
        'https://corsproxy.io/?',
        'https://cors-anywhere.herokuapp.com/'
    ];

    let currentProxyIndex = 0;

    document.getElementById('btnConsultar').addEventListener('click', consultarGarantia);
    document.getElementById('serial').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') consultarGarantia();
    });

    async function consultarGarantia() {
        const serial = document.getElementById('serial').value.trim().toUpperCase();
        const resultadoDiv = document.getElementById('resultado');
        const botao = document.getElementById('btnConsultar');

        if (!serial) {
            resultadoDiv.textContent = '⚠️ Por favor, insira um Número de Série.';
            resultadoDiv.className = 'erro';
            return;
        }

        botao.disabled = true;
        resultadoDiv.textContent = '⏳ A consultar a garantia... (tentativa com proxy ' + (currentProxyIndex + 1) + ' de ' + PROXIES.length + ')';
        resultadoDiv.className = 'loading';

        // Reset proxy index se já tentámos todos
        if (currentProxyIndex >= PROXIES.length) {
            currentProxyIndex = 0;
        }

        try {
            const proxy = PROXIES[currentProxyIndex];
            
            // --- Passo 1: Pesquisar o produto ---
            const searchUrl = `https://support.hp.com/wcc-services/searchresult/pt-pt?q=${encodeURIComponent(serial)}&context=pdp`;
            const searchFullUrl = proxy + encodeURIComponent(searchUrl);
            
            console.log(`📡 Pesquisando: ${searchFullUrl}`);
            const searchResponse = await fetch(searchFullUrl);
            
            if (!searchResponse.ok) {
                // Se falhar, tenta o próximo proxy
                if (searchResponse.status === 429 || searchResponse.status === 403) {
                    currentProxyIndex++;
                    if (currentProxyIndex < PROXIES.length) {
                        resultadoDiv.textContent = `⏳ A mudar de proxy... (${currentProxyIndex + 1}/${PROXIES.length})`;
                        return consultarGarantia();
                    }
                }
                throw new Error(`Erro na pesquisa: ${searchResponse.status}`);
            }

            const searchData = await searchResponse.json();
            const productData = searchData?.data?.verifyResponse?.data;

            if (!productData) {
                // Tenta o próximo proxy se não encontrar o produto
                currentProxyIndex++;
                if (currentProxyIndex < PROXIES.length) {
                    resultadoDiv.textContent = `⏳ A tentar outro proxy... (${currentProxyIndex + 1}/${PROXIES.length})`;
                    return consultarGarantia();
                }
                throw new Error('Produto não encontrado. Verifica o número de série.');
            }

            // Extrair dados do produto
            const sku = productData.altProductNumber || productData.productNumber || 'N/A';
            const productName = productData.productName || 'N/A';

            console.log(`✅ Produto encontrado: ${productName}`);

            // --- Passo 2: Obter detalhes da garantia ---
            const warrantyPayload = {
                cc: "pt",
                lc: "pt",
                utcOffset: "P0100",
                devices: [{
                    countryOfPurchase: "pt",
                    serialNumber: serial,
                    productNumber: sku,
                    displayProductNumber: productData.productNumber || sku
                }],
                skipSyncCall: false
            };

            const warrantyUrl = 'https://support.hp.com/wcc-services/profile/devices/warranty/specs?authState=anonymous&template=WarrantyLanding';
            const warrantyFullUrl = proxy + encodeURIComponent(warrantyUrl);

            console.log(`📡 A consultar garantia: ${warrantyFullUrl}`);
            const warrantyResponse = await fetch(warrantyFullUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(warrantyPayload)
            });

            if (!warrantyResponse.ok) {
                // Se falhar, tenta o próximo proxy
                if (warrantyResponse.status === 429 || warrantyResponse.status === 403) {
                    currentProxyIndex++;
                    if (currentProxyIndex < PROXIES.length) {
                        resultadoDiv.textContent = `⏳ A mudar de proxy... (${currentProxyIndex + 1}/${PROXIES.length})`;
                        return consultarGarantia();
                    }
                }
                throw new Error(`Erro na consulta de garantia: ${warrantyResponse.status}`);
            }

            const warrantyData = await warrantyResponse.json();

            // --- Passo 3: Extrair e formatar os dados ---
            const deviceInfo = warrantyData?.data?.devices?.[0];
            const warrantyInfo = deviceInfo?.warranty?.data;
            const productSpecs = deviceInfo?.productSpecs?.data;

            if (!warrantyInfo) {
                throw new Error('Garantia não encontrada para este produto.');
            }

            // Reset proxy index após sucesso
            currentProxyIndex = 0;

            // Formatar datas
            const startDate = warrantyInfo.warrantyStartDate ? new Date(warrantyInfo.warrantyStartDate).toLocaleDateString('pt-PT', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            }) : 'N/A';
            
            const endDate = warrantyInfo.warrantyEndDate ? new Date(warrantyInfo.warrantyEndDate).toLocaleDateString('pt-PT', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            }) : 'N/A';
            
            // Calcular dias restantes
            let remainingDays = 'N/A';
            let remainingMonths = 'N/A';
            if (warrantyInfo.warrantyEndDate) {
                const end = new Date(warrantyInfo.warrantyEndDate);
                const now = new Date();
                const diffTime = end - now;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                if (diffDays > 0) {
                    remainingDays = `${diffDays} dias`;
                    const diffMonths = Math.ceil(diffDays / 30);
                    remainingMonths = `${diffMonths} meses`;
                } else {
                    remainingDays = 'Expirada';
                    remainingMonths = 'Expirada';
                }
            }

            // Determinar status
            let statusBadge = '<span class="status-badge status-ativo">Ativo</span>';
            if (warrantyInfo.statusCode === 3) statusBadge = '<span class="status-badge status-pendente">Pendente</span>';
            else if (warrantyInfo.statusCode === 4 || warrantyInfo.statusCode === 5) statusBadge = '<span class="status-badge status-expirado">Expirado</span>';

            const resultHtml = `
✅ <strong>CONSULTA BEM-SUCEDIDA!</strong>

📦 <strong>Produto:</strong> ${productSpecs?.productName || productName}
🔹 <strong>Número de Série:</strong> ${warrantyInfo.serialNumber || serial}
🔹 <strong>Número do Produto:</strong> ${warrantyInfo.productNumber || sku}
📊 <strong>Estado:</strong> ${statusBadge} ${warrantyInfo.status || 'N/A'}
${warrantyInfo.statusDetail ? `📝 <strong>Detalhe:</strong> ${warrantyInfo.statusDetail}` : ''}
📅 <strong>Data de Início:</strong> ${startDate}
📅 <strong>Data de Fim:</strong> ${endDate}
⏳ <strong>Dias Restantes:</strong> ${remainingDays}
📆 <strong>Meses Restantes:</strong> ${remainingMonths}
${warrantyInfo.warrantyTypeDescription ? `🏷️ <strong>Tipo de Garantia:</strong> ${warrantyInfo.warrantyTypeDescription}` : ''}
${warrantyInfo.caption ? `\n📌 <strong>Resumo:</strong> ${warrantyInfo.caption}` : ''}
            `;

            resultadoDiv.innerHTML = resultHtml;
            resultadoDiv.className = 'sucesso';

        } catch (error) {
            console.error('❌ Erro detalhado:', error);
            
            let errorMessage = error.message;
            if (errorMessage.includes('Failed to fetch') || errorMessage.includes('NetworkError')) {
                errorMessage = 'Não foi possível contactar o servidor. Verifica a tua ligação à internet.';
            } else if (errorMessage.includes('429')) {
                errorMessage = 'Limite de pedidos excedido. A aguardar alguns segundos... Tenta novamente.';
            } else if (errorMessage.includes('403')) {
                errorMessage = 'Proxy bloqueado. A tentar outro proxy...';
            }

            resultadoDiv.innerHTML = `
❌ <strong>Falha na consulta</strong>

${errorMessage}

<em style="color: #666; font-size: 13px;">Verifica se o número de série está correto e tenta novamente.</em>

<details style="margin-top: 10px; font-size: 12px; color: #999;">
    <summary>🔧 Detalhes técnicos</summary>
    <pre style="background: #f1f1f1; padding: 10px; border-radius: 4px; overflow: auto; max-height: 200px; font-size: 11px;">${error.stack || 'Sem stack trace'}</pre>
</details>
            `;
            resultadoDiv.className = 'erro';
        } finally {
            botao.disabled = false;
        }
    }
</script>
</body>
</html>
