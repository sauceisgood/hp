<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Validador de Garantia HP</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            padding: 20px; 
            background: #f5f5f5;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container { 
            max-width: 700px; 
            width: 100%;
            margin: auto; 
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { 
            color: #0096d6; 
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .input-group { 
            margin-bottom: 20px; 
        }
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600;
            color: #333;
        }
        .input-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        input[type="text"] { 
            flex: 1;
            min-width: 200px;
            padding: 12px 15px; 
            border: 2px solid #ddd; 
            border-radius: 8px; 
            font-size: 16px;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #0096d6;
            outline: none;
        }
        button { 
            padding: 12px 30px; 
            background-color: #0096d6; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px;
            font-weight: 600;
            cursor: pointer; 
            transition: background-color 0.2s;
            white-space: nowrap;
        }
        button:hover:not(:disabled) {
            background-color: #0077b3;
        }
        button:disabled { 
            opacity: 0.6; 
            cursor: not-allowed; 
        }
        #resultado { 
            margin-top: 25px; 
            padding: 20px; 
            border-radius: 8px; 
            background-color: #f8f9fa; 
            border: 2px solid #e9ecef;
            white-space: pre-wrap; 
            word-wrap: break-word; 
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.8;
            min-height: 100px;
            transition: all 0.3s;
        }
        .sucesso { 
            border-color: #28a745; 
            background-color: #d4edda; 
        }
        .erro { 
            border-color: #dc3545; 
            background-color: #f8d7da; 
        }
        .loading {
            border-color: #ffc107;
            background-color: #fff3cd;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #888;
        }
        .detalhe {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #dee2e6;
        }
        .test-list {
            margin-top: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 13px;
        }
        .test-list span {
            display: inline-block;
            background: #e9ecef;
            padding: 2px 10px;
            border-radius: 12px;
            margin: 3px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .test-list span:hover {
            background: #0096d6;
            color: white;
        }
        @media (max-width: 600px) {
            .container { padding: 20px; }
            .input-row { flex-direction: column; }
            button { width: 100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔍 Validador de Garantia HP</h1>
    <p style="color: #666; margin-bottom: 25px;">Insere o número de série para consultar o estado da garantia.</p>
    
    <div class="input-group">
        <label for="serial">Número de Série:</label>
        <div class="input-row">
            <input type="text" id="serial" placeholder="Ex: 39PKA1" value="39PKA1">
            <button id="btnConsultar">Consultar</button>
        </div>
    </div>

    <div class="test-list">
        💡 Testes rápidos:
        <span onclick="document.getElementById('serial').value='39PKA1'; consultarGarantia();">39PKA1</span>
        <span onclick="document.getElementById('serial').value='5CD1234XYZ'; consultarGarantia();">5CD1234XYZ</span>
        <span onclick="document.getElementById('serial').value='CND1234ABC'; consultarGarantia();">CND1234ABC</span>
    </div>

    <div id="resultado">Aguardando consulta...</div>
    <div class="footer">🔒 As chamadas são feitas através de um proxy seguro</div>
</div>

<script>
    document.getElementById('btnConsultar').addEventListener('click', consultarGarantia);
    document.getElementById('serial').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') consultarGarantia();
    });

    // Determinar a URL base da API
    function getApiUrl() {
        // Em desenvolvimento local, usa o proxy CORS
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            return '/api/warranty';
        }
        // Em produção, usa o caminho relativo
        return '/api/warranty';
    }

    async function consultarGarantia() {
        const serial = document.getElementById('serial').value.trim().toUpperCase();
        const resultadoDiv = document.getElementById('resultado');
        const botao = document.getElementById('btnConsultar');

        if (!serial) {
            resultadoDiv.textContent = '⚠️ Por favor, insira um Número de Série.';
            resultadoDiv.className = 'erro';
            return;
        }

        botao.disabled = true;
        resultadoDiv.textContent = '⏳ A consultar a garantia...';
        resultadoDiv.className = 'loading';

        try {
            const apiUrl = getApiUrl();
            console.log(`📡 A chamar API: ${apiUrl}`);

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ serialNumber: serial })
            });

            // Verificar se a resposta é JSON válido
            const contentType = response.headers.get('content-type');
            if (!contentType || !contentType.includes('application/json')) {
                const text = await response.text();
                console.error('Resposta não é JSON:', text.substring(0, 200));
                
                // Se a resposta começa com HTML, provavelmente é a página inicial
                if (text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html')) {
                    throw new Error('A API não está configurada corretamente. Verifica o deploy na Vercel.');
                }
                throw new Error(`A API retornou: ${text.substring(0, 100)}...`);
            }

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || `Erro ${response.status}`);
            }

            if (data.success) {
                const info = data.data;
                
                // Formatar datas
                const startDate = info.warrantyStartDate ? new Date(info.warrantyStartDate).toLocaleDateString('pt-PT', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                }) : 'N/A';
                
                const endDate = info.warrantyEndDate ? new Date(info.warrantyEndDate).toLocaleDateString('pt-PT', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                }) : 'N/A';
                
                // Calcular dias restantes
                let remainingDays = 'N/A';
                let remainingMonths = 'N/A';
                if (info.warrantyEndDate) {
                    const end = new Date(info.warrantyEndDate);
                    const now = new Date();
                    const diffTime = end - now;
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    
                    if (diffDays > 0) {
                        remainingDays = `${diffDays} dias`;
                        const diffMonths = Math.ceil(diffDays / 30);
                        remainingMonths = `${diffMonths} meses`;
                    } else {
                        remainingDays = 'Expirada';
                        remainingMonths = 'Expirada';
                    }
                }

                // Determinar status colorido
                let statusEmoji = '🟢';
                if (info.statusCode === 3) statusEmoji = '🟡';
                else if (info.statusCode === 4 || info.statusCode === 5) statusEmoji = '🔴';

                resultadoDiv.innerHTML = `
✅ <strong>CONSULTA BEM-SUCEDIDA!</strong>

📦 <strong>Produto:</strong> ${info.productName || 'N/A'}
🔹 <strong>Número de Série:</strong> ${info.serialNumber}
🔹 <strong>Número do Produto:</strong> ${info.productNumber || 'N/A'}
📊 <strong>Estado:</strong> ${statusEmoji} ${info.status || 'N/A'}
${info.statusDetail ? `📝 <strong>Detalhe:</strong> ${info.statusDetail}` : ''}
📅 <strong>Data de Início:</strong> ${startDate}
📅 <strong>Data de Fim:</strong> ${endDate}
⏳ <strong>Dias Restantes:</strong> ${remainingDays}
📆 <strong>Meses Restantes:</strong> ${remainingMonths}
${info.warrantyType ? `🏷️ <strong>Tipo de Garantia:</strong> ${info.warrantyType}` : ''}
${info.caption ? `\n📌 <strong>Resumo:</strong> ${info.caption}` : ''}
                `;
                resultadoDiv.className = 'sucesso';
            } else {
                throw new Error(data.error || 'Produto não encontrado');
            }

        } catch (error) {
            console.error('❌ Erro detalhado:', error);
            
            let errorMessage = error.message;
            // Mensagens de erro mais amigáveis
            if (errorMessage.includes('Failed to fetch') || errorMessage.includes('NetworkError')) {
                errorMessage = 'Não foi possível contactar o servidor. Verifica a tua ligação à internet.';
            } else if (errorMessage.includes('404')) {
                errorMessage = 'A API não foi encontrada. Verifica a configuração do servidor.';
            } else if (errorMessage.includes('500')) {
                errorMessage = 'Erro interno no servidor. Tenta novamente mais tarde.';
            }

            resultadoDiv.innerHTML = `
❌ <strong>Falha na consulta</strong>

${errorMessage}

<em style="color: #666; font-size: 13px;">Verifica se o número de série está correto e tenta novamente.</em>

<details style="margin-top: 10px; font-size: 12px; color: #999;">
    <summary>🔧 Detalhes técnicos</summary>
    <pre style="background: #f1f1f1; padding: 10px; border-radius: 4px; overflow: auto; max-height: 200px;">${error.stack || 'Sem stack trace'}</pre>
</details>
            `;
            resultadoDiv.className = 'erro';
        } finally {
            botao.disabled = false;
        }
    }

    // Verificar se a API está a funcionar ao carregar a página
    window.addEventListener('load', async function() {
        try {
            const response = await fetch('/api/warranty', {
                method: 'OPTIONS'
            });
            console.log('✅ API disponível');
        } catch (error) {
            console.warn('⚠️ API não disponível:', error.message);
        }
    });
</script>
</body>
</html>
